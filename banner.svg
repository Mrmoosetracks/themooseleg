<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <!-- sky: deep dusk to warm horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160f30"/>
      <stop offset="0.28" stop-color="#34205a"/>
      <stop offset="0.52" stop-color="#7d3769"/>
      <stop offset="0.72" stop-color="#cf5d60"/>
      <stop offset="0.86" stop-color="#f29660"/>
      <stop offset="1" stop-color="#ffc98a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a8" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#ffb877" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff8f6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunDisc" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fffaea"/>
      <stop offset="0.6" stop-color="#ffe6b0"/>
      <stop offset="1" stop-color="#ffc77f"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb87d" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#ffb87d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb87d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4466"/>
      <stop offset="1" stop-color="#5b2d55"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c2650"/>
      <stop offset="1" stop-color="#2e1a40"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26173b"/>
      <stop offset="1" stop-color="#0f0a1e"/>
    </linearGradient>
    <!-- figures -->
    <linearGradient id="manFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1632"/>
      <stop offset="1" stop-color="#0c0819"/>
    </linearGradient>
    <linearGradient id="womanFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b3060"/>
      <stop offset="1" stop-color="#2a1b3b"/>
    </linearGradient>
    <linearGradient id="womanRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdcb0"/>
      <stop offset="1" stop-color="#ec8e66"/>
    </linearGradient>
    <linearGradient id="bowFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8ea"/>
      <stop offset="1" stop-color="#d6d9c0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ee"/>
      <stop offset="1" stop-color="#ffe0c0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0.55" stop-color="#0a0616" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0616" stop-opacity="0.4"/>
    </radialGradient>
    <!-- warm backlight glow around silhouettes -->
    <filter id="backlight" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="d"/>
      <feGaussianBlur in="d" stdDeviation="5" result="b"/>
      <feFlood flood-color="#ffc98a" flood-opacity="0.75"/>
      <feComposite in2="b" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a0f2e" flood-opacity="0.55"/>
    </filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- background -->
  <rect width="1500" height="500" fill="url(#sky)"/>
  <g fill="#fff3dc">
    <circle cx="210" cy="48" r="1.2" opacity="0.7"/><circle cx="420" cy="90" r="1" opacity="0.5"/>
    <circle cx="610" cy="36" r="1.4" opacity="0.6"/><circle cx="760" cy="110" r="0.9" opacity="0.4"/>
    <circle cx="1290" cy="40" r="1.1" opacity="0.6"/><circle cx="1420" cy="96" r="1.3" opacity="0.5"/>
    <circle cx="90" cy="120" r="0.9" opacity="0.4"/><circle cx="880" cy="58" r="1" opacity="0.5"/>
  </g>
  <circle cx="1050" cy="290" r="420" fill="url(#halo)"/>
  <circle cx="1050" cy="290" r="125" fill="url(#sunDisc)"/>
  <path d="M0 418 Q 180 392 380 410 T 760 404 T 1140 412 T 1500 398 V500 H0 Z" fill="url(#hillFar)" opacity="0.8"/>
  <rect x="0" y="360" width="1500" height="100" fill="url(#haze)"/>
  <path d="M0 440 Q 240 420 520 436 T 1040 432 T 1500 426 V500 H0 Z" fill="url(#hillMid)"/>
  <path d="M0 458 Q 300 440 600 452 T 1200 449 T 1500 452 V500 H0 Z" fill="url(#ground)"/>
  <!-- contact shadows -->
  <g fill="#07040f" opacity="0.6" filter="url(#blur6)">
    <ellipse cx="1050" cy="470" rx="70" ry="6"/>
    <ellipse cx="800" cy="470" rx="36" ry="5"/>
  </g>

  <g filter="url(#backlight)">
  <!-- MAN (tall, athletic, behind) — ~8 heads tall -->
  <g fill="url(#manFill)" stroke="#120d22" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs -->
    <path d="M1009 288 L1049 288 L1044 380 L1040 460 L1022 460 L1016 380 Z"/>
    <path d="M1051 288 L1091 288 L1084 380 L1078 460 L1060 460 L1056 380 Z"/>
    <path d="M1018 458 h26 v10 h-32 q0-10 6-10 Z"/>
    <path d="M1056 458 h26 q6 0 6 10 h-32 Z"/>
    <!-- torso: broad shoulders, V-taper -->
    <path d="M1036 164 Q1006 166 992 172 Q976 180 978 205 L996 214 Q1004 240 1012 262 L1008 292 L1092 292 L1088 262 Q1096 240 1104 214 L1122 205 Q1124 180 1108 172 Q1094 166 1064 164 Z"/>
    <!-- neck + head -->
    <path d="M1037 145 h26 v24 h-26 Z"/>
    <ellipse cx="1050" cy="133" rx="18" ry="22"/>
    <!-- upper arms -->
    <path d="M986 186 Q970 220 980 256" stroke-width="28" fill="none"/>
    <path d="M1114 186 Q1130 220 1120 256" stroke-width="28" fill="none"/>
  </g>

  <!-- WOMAN (petite, in front) -->
  <g fill="url(#womanFill)" stroke="url(#womanRim)" stroke-width="3" stroke-linejoin="round">
    <!-- hair back -->
    <path d="M1028 206 Q1026 182 1050 180 Q1076 182 1073 208 Q1080 250 1072 292 L1028 292 Q1020 250 1028 206 Z"/>
    <!-- legs -->
    <path d="M1036 400 L1046 400 L1045 462 L1037 462 Z"/>
    <path d="M1054 400 L1064 400 L1063 462 L1055 462 Z"/>
    <path d="M1031 462 h15 v5 h-17 Z"/>
    <path d="M1054 462 h15 l2 5 h-17 Z"/>
    <!-- dress -->
    <path d="M1020 262 Q1050 254 1080 262 L1074 300 L1068 330 L1100 412 Q1050 422 1000 412 L1032 330 L1026 300 Z"/>
    <!-- arms -->
    <path d="M1020 264 Q1010 300 1012 345 L1020 345 Q1022 305 1030 280 Z"/>
    <path d="M1080 264 Q1090 300 1088 345 L1080 345 Q1078 305 1070 280 Z"/>
    <!-- neck + head -->
    <path d="M1044 236 h12 v24 h-12 Z"/>
    <ellipse cx="1050" cy="216" rx="18" ry="22"/>
    <!-- hair front/top -->
    <path d="M1031 214 Q1030 190 1050 189 Q1072 190 1070 214 Q1062 200 1050 200 Q1038 200 1031 214 Z" stroke="none" fill="#2a1c35"/>
  </g>

  <!-- MAN forearms + hands resting on her shoulders (drawn over her) -->
  <g stroke="#120d22" stroke-linecap="round" fill="#120d22">
    <path d="M980 256 Q994 268 1014 266" stroke-width="22" fill="none"/>
    <path d="M1120 256 Q1106 268 1086 266" stroke-width="22" fill="none"/>
    <ellipse cx="1022" cy="265" rx="12" ry="9" stroke="none"/>
    <ellipse cx="1078" cy="265" rx="12" ry="9" stroke="none"/>
  </g>
  </g>

  <!-- SECOND MAN (same height as the woman), left of the couple, bowing toward them (mirrored) -->
  <g transform="translate(2100 0) scale(-1 1)" fill="url(#bowFill)" stroke="#e6e9d4" filter="url(#softShadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs (side view) -->
    <path d="M1290 330 L1314 330 L1310 400 L1308 462 L1294 462 L1292 400 Z"/>
    <path d="M1308 458 L1308 468 L1280 468 Q1280 458 1290 458 Z"/>
    <!-- bent torso -->
    <path d="M1302 334 L1218 284" stroke-width="40" fill="none"/>
    <!-- neck + head, bowed -->
    <path d="M1212 280 L1190 268" stroke-width="13" fill="none"/>
    <ellipse cx="1180" cy="264" rx="15" ry="17" transform="rotate(-60 1180 264)"/>
    <!-- arm folded across the waist -->
    <path d="M1222 290 L1226 330 L1264 324" stroke-width="13" fill="none"/>
  </g>

  <!-- text -->
  <g font-family="Georgia, 'Times New Roman', serif" filter="url(#softShadow)">
    <text x="90" y="200" font-size="96" font-weight="bold" letter-spacing="8" fill="url(#title)">ENM</text>
    <text x="94" y="244" font-size="24" letter-spacing="5" fill="#ffe0c0">ETHICAL NON-MONOGAMY</text>
    <rect x="94" y="264" width="64" height="2" fill="#ffcf9f" opacity="0.8"/>
    <text x="94" y="304" font-size="26" fill="#ffdcbc" font-style="italic" opacity="0.92">Strength that stands with you.</text>
  </g>

  <!-- vignette -->
  <rect width="1500" height="500" fill="url(#vignette)"/>
</svg>
