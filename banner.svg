<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1e4a"/>
      <stop offset="0.55" stop-color="#c2546b"/>
      <stop offset="1" stop-color="#f6a65a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset="0.7" stop-color="#ffd38a"/>
      <stop offset="1" stop-color="#ffd38a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1500" height="500" fill="url(#sky)"/>
  <circle cx="1050" cy="300" r="230" fill="url(#sun)" opacity="0.85"/>
  <path d="M0 455 Q 300 430 600 450 T 1200 445 T 1500 450 V500 H0 Z" fill="#1b1430"/>

  <!-- MAN (big, strong, behind) -->
  <g fill="#120d22" stroke="#120d22" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs -->
    <path d="M985 330 L1048 330 L1040 462 L992 462 Z"/>
    <path d="M1052 330 L1115 330 L1108 462 L1060 462 Z"/>
    <path d="M982 458 h62 v12 h-70 q0-12 8-12 Z"/>
    <path d="M1056 458 h62 q8 0 8 12 h-70 Z"/>
    <!-- torso: broad shoulders, V-taper -->
    <path d="M960 166 Q1050 150 1140 166 Q1192 176 1194 222 L1178 300 L1112 338 L988 338 L922 300 L906 222 Q908 176 960 166 Z"/>
    <!-- neck + head -->
    <path d="M1026 128 h48 v42 h-48 Z"/>
    <ellipse cx="1050" cy="104" rx="31" ry="37"/>
    <!-- upper arms (thick) -->
    <path d="M940 175 Q880 190 884 250 Q886 300 912 335 L962 325 Q958 290 962 250 Z"/>
    <path d="M1160 175 Q1220 190 1216 250 Q1214 300 1188 335 L1138 325 Q1142 290 1138 250 Z"/>
  </g>

  <!-- WOMAN (petite, in front) -->
  <g fill="#3a2747" stroke="#ffb38a" stroke-width="3" stroke-linejoin="round">
    <!-- hair back -->
    <path d="M1028 206 Q1026 182 1050 180 Q1076 182 1073 208 Q1080 250 1072 292 L1028 292 Q1020 250 1028 206 Z"/>
    <!-- legs -->
    <path d="M1036 400 L1046 400 L1045 462 L1037 462 Z"/>
    <path d="M1054 400 L1064 400 L1063 462 L1055 462 Z"/>
    <path d="M1031 462 h15 v5 h-17 Z"/>
    <path d="M1054 462 h15 l2 5 h-17 Z"/>
    <!-- dress -->
    <path d="M1020 262 Q1050 254 1080 262 L1074 300 L1068 330 L1100 412 Q1050 422 1000 412 L1032 330 L1026 300 Z"/>
    <!-- arms -->
    <path d="M1020 264 Q1010 300 1012 345 L1020 345 Q1022 305 1030 280 Z"/>
    <path d="M1080 264 Q1090 300 1088 345 L1080 345 Q1078 305 1070 280 Z"/>
    <!-- neck + head -->
    <path d="M1044 236 h12 v24 h-12 Z"/>
    <ellipse cx="1050" cy="216" rx="18" ry="22"/>
    <!-- hair front/top -->
    <path d="M1031 214 Q1030 190 1050 189 Q1072 190 1070 214 Q1062 200 1050 200 Q1038 200 1031 214 Z" stroke="none" fill="#2a1c35"/>
  </g>

  <!-- MAN forearms + hands resting on her shoulders (drawn over her) -->
  <g stroke="#120d22" stroke-linecap="round" fill="#120d22">
    <path d="M936 322 Q960 285 1012 270" stroke-width="40" fill="none"/>
    <path d="M1164 322 Q1140 285 1088 270" stroke-width="40" fill="none"/>
    <ellipse cx="1022" cy="268" rx="18" ry="13" stroke="none"/>
    <ellipse cx="1078" cy="268" rx="18" ry="13" stroke="none"/>
  </g>

  <!-- text -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#fff4e6">
    <text x="90" y="215" font-size="96" font-weight="bold" letter-spacing="4">Love</text>
    <text x="94" y="275" font-size="28" fill="#ffd9b8" font-style="italic">Strength that stands with you.</text>
  </g>
</svg>
