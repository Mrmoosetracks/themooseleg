<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#FF2E93"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1B5C"/>
      <stop offset="1" stop-color="#120A2E"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFE45C"/>
      <stop offset="1" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><circle cx="256" cy="256" r="232"/></clipPath>
  </defs>

  <!-- outer ring -->
  <circle cx="256" cy="256" r="248" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#120A2E" stroke-width="8"/>
  <circle cx="256" cy="256" r="232" fill="url(#bg)"/>

  <g clip-path="url(#c)">
    <!-- background spade -->
    <path fill="#FFFFFF" fill-opacity="0.3"
      d="M256 40 C 230 100, 60 170, 60 280 C 60 350, 120 390, 180 390 C 214 390, 236 376, 246 360 C 242 400, 222 430, 186 456 L 326 456 C 290 430, 270 400, 266 360 C 276 376, 298 390, 332 390 C 392 390, 452 350, 452 280 C 452 170, 282 100, 256 40 Z"/>

    <!-- ground glow -->
    <ellipse cx="256" cy="468" rx="170" ry="34" fill="#120A2E" fill-opacity="0.25"/>

    <!-- staff -->
    <rect x="344" y="168" width="10" height="300" rx="5" fill="#120A2E"/>
    <circle cx="349" cy="160" r="40" fill="url(#orb)"/>
    <circle cx="349" cy="160" r="14" fill="#FFFFFF"/>

    <!-- robe -->
    <path fill="url(#robe)"
      d="M256 120
         C 226 150, 214 200, 210 240
         C 190 300, 160 380, 140 480
         L 372 480
         C 352 380, 322 300, 302 240
         C 298 200, 286 150, 256 120 Z"/>
    <!-- arm reaching to staff -->
    <path fill="#2A1B5C" d="M296 262 C 318 268, 336 276, 350 284 L 350 304 C 330 300, 310 296, 290 292 Z"/>
    <circle cx="349" cy="292" r="11" fill="#F6D7C3"/>

    <!-- hood opening -->
    <path fill="#05020F"
      d="M256 170 C 232 184, 226 214, 230 244 C 240 262, 272 262, 282 244 C 286 214, 280 184, 256 170 Z"/>
    <!-- glowing eyes -->
    <ellipse cx="245" cy="222" rx="7" ry="4" fill="#00E5FF"/>
    <ellipse cx="267" cy="222" rx="7" ry="4" fill="#00E5FF"/>

    <!-- belt with gem -->
    <rect x="214" y="318" width="84" height="12" rx="6" fill="#FFE45C"/>
    <circle cx="256" cy="324" r="9" fill="#FF2E93" stroke="#FFFFFF" stroke-width="3"/>
  </g>
</svg>
